html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
header{padding:14px 14px 6px}
h1{margin:0;font-size:19px}
h2{font-size:16px;margin:14px 0 8px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:7px 12px;border-radius:8px;font:inherit}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:6px 14px 40px}
.w{overflow-x:auto;border:1px solid var(--bd);border-radius:8px;background:var(--sf)}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;font-size:14px}
th{background:var(--ac2);position:sticky;top:0}
td.n,th.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
tr.t td{font-weight:700;background:var(--ac2)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;max-width:100%}
td input{width:100%;min-width:70px;padding:4px 6px}
textarea{width:100%;min-height:120px}
.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;margin:3px 0}
.b.g{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.b.r{background:var(--rd);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:8px 0}
.ok{color:var(--ac);font-weight:700}.er{color:var(--rd);font-weight:700}.mu{color:var(--mu);font-size:13px}
@media print{nav,header,.np{display:none}body{background:#fff;color:#000}}
body.fsmode header,body.fsmode nav{display:none}
body.fsmode main#m{position:fixed;inset:0;overflow:auto;z-index:40;background:var(--bg);margin:0;padding:calc(58px + env(safe-area-inset-top,0px)) 14px calc(76px + env(safe-area-inset-bottom,0px))}
.fsback{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-start:14px;z-index:50;padding:8px 16px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.18)}
#hadithToday{width:100%;max-width:none;margin:0 auto;padding:7px 12px;background:rgba(255,255,255,.96);border:1.5px solid #15966f;border-radius:10px;box-shadow:0 2px 8px -7px rgba(0,90,60,.35);text-align:center;min-width:0;color:#173d32;align-self:center}
#hadithToday .ht-icon{width:23px;height:23px;margin:0 auto 2px;border:1.5px solid #15966f;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#087653;background:#e8f7ef;font-size:14px}
#hadithToday .ht-head{display:block;font-weight:800;color:#087653;font-size:13px;margin-bottom:3px}
#hadithToday .ht-body{font-size:13px;font-weight:700;line-height:1.55;margin:2px auto;color:#173d32;white-space:normal;overflow:visible;max-height:none}
#hadithToday .ht-foot{font-size:10px;color:#52665e;display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:3px}
#hadithToday a{color:#087653;font-weight:700;text-decoration:none}
#hadithToday .ht-count{display:none}
.hb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto;align-items:center;gap:8px 16px;width:100%}
.hb-title{grid-column:1;grid-row:1;display:flex;align-items:center;gap:12px;min-width:0;justify-self:start}
.hb-title h1{white-space:nowrap;font-size:19px}
#clk{grid-column:2;grid-row:1;display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:10px;min-width:0;white-space:nowrap}
#clk .ck-top{display:flex;align-items:center;justify-content:center;gap:7px;direction:rtl}

#clk .ck-day{font-size:12px;font-weight:800}
#clk .ck-d{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:nowrap}
#clk .ck-d>div{text-align:center;display:flex;align-items:center;gap:4px}
#clk .ck-d em{font-style:normal;font-size:10px;opacity:.8}
#clk .ck-d span{font-size:12px;font-weight:700}
#hadithToday{grid-column:1/-1;grid-row:2;width:100%;max-width:none}

.vn{padding:4px 14px;border-radius:12px;color:#fff;font-weight:800;background:linear-gradient(180deg,#818cf8,#4f46e5);box-shadow:0 3px 0 #3730a3}

.en{margin-top:10px;padding:10px;border-radius:16px;background:var(--z)}.eh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.fl{margin:8px 0;padding:9px 12px;border-radius:12px;background:var(--sf);border:1.5px dashed var(--ac);line-height:1.9}

/* تحسين صف العنوان والتاريخ مع إبقاء بطاقة الحديث كما هي */
.hb{grid-template-columns:minmax(245px,1.05fr) minmax(420px,2fr) minmax(285px,1.2fr);gap:12px}
.hb-title h1{font-size:17px;white-space:nowrap}
#clk{flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;white-space:nowrap;width:100%}

#clk .ck-day{font-size:14px}

<script>
const IC={mem:["👥","#ff9a5a","#f43f5e"],rc:["💰","#4ade80","#059669"],vou:["📒","#60a5fa","#2563eb"],led:["📚","#c4b5fd","#7c3aed"],tb:["⚖️","#fcd34d","#d97706"],pl:["📈","#5eead4","#0f766e"],bs:["🏛️","#f9a8d4","#be185d"],mled:["🧾","#67e8f9","#0891b2"],yr:["🔄","#a5b4fc","#4338ca"],bk:["💾","#cbd5e1","#475569"]};
const tile=(i,own,cls)=>'<span class="ic'+(cls?" "+cls:"")+'"'+(own?' style="--c1:'+i[1]+';--c2:'+i[2]+'"':"")+'>'+i[0]+'</span>';
const kc=(i,v,l)=>'<div class="kc" role="button" tabindex="0" aria-label="إظهار '+l+'" aria-expanded="false" onclick="this.classList.toggle(\'revealed\');this.setAttribute(\'aria-expanded\',this.classList.contains(\'revealed\'))" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();this.click()}">'+tile(i,1,"sm")+'<div><b>'+v+'</b><small>'+l+'</small></div></div>';
const HADITH_CACHE="hs_nawawi_daily_v1";
const NAWAWI=[
["إنما الأعمال بالنيات","إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى، فمن كانت هجرته إلى الله ورسوله فهجرته إلى الله ورسوله، ومن كانت هجرته لدنيا يصيبها أو امرأة ينكحها فهجرته إلى ما هاجر إليه.","عمر بن الخطاب — متفق عليه"],
["حديث جبريل","بينما نحن جلوس عند رسول الله ﷺ ذات يوم، إذ طلع علينا رجل شديد بياض الثياب، شديد سواد الشعر، لا يُرى عليه أثر السفر، ولا يعرفه منا أحد... فسأله عن الإسلام والإيمان والإحسان.","عمر بن الخطاب — رواه مسلم"],
["أركان الإسلام الخمسة","بُني الإسلام على خمس: شهادة أن لا إله إلا الله وأن محمداً رسول الله، وإقام الصلاة، وإيتاء الزكاة، وحج البيت، وصوم رمضان.","ابن عمر — متفق عليه"],
["خلق الإنسان وقدره","إن أحدكم يُجمع خلقه في بطن أمه أربعين يوماً نطفة، ثم يكون علقة مثل ذلك، ثم يكون مضغة مثل ذلك... ثم يُرسل إليه الملك.","عبد الله بن مسعود — متفق عليه"],
["رد البدع","من أحدث في أمرنا هذا ما ليس منه فهو رد.","عائشة — متفق عليه"],
["الحلال بيّن والحرام بيّن","إن الحلال بيّن وإن الحرام بيّن، وبينهما أمور مشتبهات لا يعلمهن كثير من الناس، فمن اتقى الشبهات فقد استبرأ لدينه وعرضه.","النعمان بن بشير — متفق عليه"],
["الدين النصيحة","الدين النصيحة. قلنا: لمن؟ قال: لله، ولكتابه، ولرسوله، ولأئمة المسلمين وعامتهم.","تميم الداري — رواه مسلم"],
["حرمة دم المسلم","أُمرت أن أقاتل الناس حتى يشهدوا أن لا إله إلا الله وأن محمداً رسول الله، ويقيموا الصلاة، ويؤتوا الزكاة... وحسابهم على الله تعالى.","ابن عمر — متفق عليه"],
["ما نهيتكم عنه فاجتنبوه","ما نهيتكم عنه فاجتنبوه، وما أمرتكم به فأتوا منه ما استطعتم، فإنما أهلك الذين من قبلكم كثرة مسائلهم واختلافهم على أنبيائهم.","أبو هريرة — متفق عليه"],
["إن الله طيب لا يقبل إلا طيباً","إن الله تعالى طيب لا يقبل إلا طيباً، وإن الله أمر المؤمنين بما أمر به المرسلين.","أبو هريرة — رواه مسلم"],
["دع ما يريبك","دع ما يريبك إلى ما لا يريبك.","الحسن بن علي — رواه الترمذي والنسائي"],
["ترك ما لا يعنيك","من حسن إسلام المرء تركه ما لا يعنيه.","أبو هريرة — رواه الترمذي وحسنه"],
["حب الخير للآخرين","لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه.","أنس بن مالك — متفق عليه"],
["حرمة دم المسلم في ثلاث","لا يحل دم امرئ مسلم يشهد أن لا إله إلا الله وأني رسول الله إلا بإحدى ثلاث: الثيب الزاني، والنفس بالنفس، والتارك لدينه المفارق للجماعة.","ابن مسعود — متفق عليه"],
["فليقل خيراً أو ليصمت","من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت، ومن كان يؤمن بالله واليوم الآخر فليكرم جاره، ومن كان يؤمن بالله واليوم الآخر فليكرم ضيفه.","أبو هريرة — متفق عليه"],
["لا تغضب","قال رجل للنبي ﷺ: أوصني. قال: لا تغضب. فردد مراراً، قال: لا تغضب.","أبو هريرة — رواه البخاري"],
["الإحسان في كل شيء","إن الله كتب الإحسان على كل شيء، فإذا قتلتم فأحسنوا القِتلة، وإذا ذبحتم فأحسنوا الذِّبحة، وليحدّ أحدكم شفرته، وليرح ذبيحته.","شداد بن أوس — رواه مسلم"],
["التقوى وحسن الخلق","اتق الله حيثما كنت، وأتبع السيئة الحسنة تمحها، وخالق الناس بخلق حسن.","أبو ذر ومعاذ — رواه الترمذي وحسنه"],
["احفظ الله يحفظك","يا غلام إني أعلمك كلمات: احفظ الله يحفظك، احفظ الله تجده تجاهك، إذا سألت فاسأل الله، وإذا استعنت فاستعن بالله.","ابن عباس — رواه الترمذي وقال حسن صحيح"],
["الحياء من الإيمان","إن مما أدرك الناس من كلام النبوة الأولى: إذا لم تستح فاصنع ما شئت.","أبو مسعود — رواه البخاري"],
["الاستقامة","قل: آمنت بالله، ثم استقم.","سفيان بن عبد الله — رواه مسلم"],
["طريق الجنة","إذا صليت المكتوبات، وصمت رمضان، وأحللت الحلال، وحرمت الحرام، ولم أزد على ذلك شيئاً، أأدخل الجنة؟ قال: نعم.","جابر بن عبد الله — رواه مسلم"],
["الطهور شطر الإيمان","الطهور شطر الإيمان، والحمد لله تملأ الميزان، وسبحان الله والحمد لله تملآن ما بين السماوات والأرض.","أبو مالك الأشعري — رواه مسلم"],
["تحريم الظلم","يا عبادي، إني حرمت الظلم على نفسي وجعلته بينكم محرماً فلا تظالموا.","أبو ذر الغفاري — رواه مسلم"],
["الصدقة بالذكر","ذهب أهل الدثور بالأجور... قال: أوليس قد جعل الله لكم ما تصدقون؟ إن بكل تسبيحة صدقة.","أبو ذر — رواه مسلم"],
["كل يوم صدقة","كل سلامى من الناس عليه صدقة كل يوم تطلع فيه الشمس: تعدل بين اثنين صدقة، وتعين الرجل في دابته فتحمله عليها صدقة، والكلمة الطيبة صدقة.","أبو هريرة — متفق عليه"],
["البر حسن الخلق","البر حسن الخلق، والإثم ما حاك في نفسك وكرهت أن يطلع عليه الناس.","النواس بن سمعان — رواه مسلم"],
["عليكم بسنتي","أوصيكم بتقوى الله والسمع والطاعة... فعليكم بسنتي وسنة الخلفاء الراشدين المهديين، عضوا عليها بالنواجذ.","العرباض بن سارية — رواه أبو داود والترمذي"],
["أبواب الخير","تعبد الله لا تشرك به شيئاً، وتقيم الصلاة، وتؤتي الزكاة، وتصوم رمضان، وتحج البيت.","معاذ بن جبل — رواه الترمذي وحسنه"],
["الفرائض والحدود","إن الله تعالى فرض فرائض فلا تضيعوها، وحد حدوداً فلا تعتدوها، وحرم أشياء فلا تنتهكوها، وسكت عن أشياء رحمة لكم غير نسيان فلا تبحثوا عنها.","أبو ثعلبة الخشني — رواه الدارقطني"],
["الزهد","ازهد في الدنيا يحبك الله، وازهد فيما عند الناس يحبك الناس.","سهل بن سعد — رواه ابن ماجه"],
["لا ضرر ولا ضرار","لا ضرر ولا ضرار.","أبو سعيد الخدري — رواه ابن ماجه والدارقطني"],
["البينة على المدعي","لو يُعطى الناس بدعواهم، لادعى ناس أموال قوم ودماءهم، لكن البينة على المدعي، واليمين على من أنكر.","ابن عباس — رواه البيهقي"],
["تغيير المنكر","من رأى منكم منكراً فليغيره بيده، فإن لم يستطع فبلسانه، فإن لم يستطع فبقلبه، وذلك أضعف الإيمان.","أبو سعيد الخدري — رواه مسلم"],
["الأخوة والمحبة","لا تحاسدوا ولا تباغضوا ولا تدابروا، وكونوا عباد الله إخواناً. المسلم أخو المسلم، لا يظلمه ولا يخذله ولا يكذبه ولا يحقره.","أبو هريرة — رواه مسلم"],
["تفريج الكرب","من نفس عن مؤمن كربة من كرب الدنيا نفس الله عنه كربة من كرب يوم القيامة، ومن يسر على معسر يسر الله عليه في الدنيا والآخرة.","أبو هريرة — رواه مسلم"],
["كتابة الحسنات والسيئات","من همّ بحسنة فلم يعملها كتبها الله عنده حسنة كاملة، وإن همّ بها فعملها كتبها الله له عشر حسنات إلى سبعمائة ضعف.","ابن عباس — متفق عليه"],
["ولاية الله","من عادى لي ولياً فقد آذنته بالحرب، وما تقرب إلي عبدي بشيء أحب إلي مما افترضت عليه.","أبو هريرة — رواه البخاري"],
["رفع الخطأ والنسيان","إن الله تجاوز عن أمتي الخطأ والنسيان وما استكرهوا عليه.","ابن عباس — رواه ابن ماجه والبيهقي"],
["كن في الدنيا كأنك غريب","كن في الدنيا كأنك غريب أو عابر سبيل. وكان ابن عمر يقول: إذا أمسيت فلا تنتظر الصباح، وإذا أصبحت فلا تنتظر المساء.","ابن عمر — رواه البخاري"],
["اتباع الوحي","لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به.","عبد الله بن عمرو — رواه في كتاب الحجة بإسناد صحيح"],
["سعة رحمة الله","يا ابن آدم، إنك ما دعوتني ورجوتني غفرت لك على ما كان منك ولا أبالي... ولو أتيتني بقراب الأرض خطايا ثم لقيتني لا تشرك بي شيئاً لأتيتك بقرابها مغفرة.","أنس بن مالك — رواه الترمذي وقال حسن صحيح"]
];
function hadithDate(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dailyHadithIndex(){const d=new Date(),today=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()),base=Date.UTC(2024,0,1);return Math.floor((today-base)/86400000)%NAWAWI.length}
function hadithCard(){const n=dailyHadithIndex(),h=NAWAWI[n];return '<section id="hadithToday"><div class="ht-icon" aria-hidden="true">📖</div><div class="ht-head">حديث اليوم من الأربعين النووية</div><div class="ht-body" id="dailyHadithText">'+esc(h[1])+'</div><div class="ht-foot"><span id="dailyHadithRef">الحديث '+(n+1)+' — '+esc(h[2])+'</span><a href="https://www.al-adkar.com/hadith/40-nawawiyah" target="_blank" rel="noopener">متن الأربعين النووية</a></div><div class="ht-count">يتجدد تلقائياً كل يوم · '+(n+1)+' من 42</div></section>'}
function loadDailyHadith(){if(!window.nawawiDailyTimer)window.nawawiDailyTimer=setInterval(loadDailyHadith,60000);const n=dailyHadithIndex(),h=NAWAWI[n],t=document.getElementById("dailyHadithText"),r=document.getElementById("dailyHadithRef");if(t)t.textContent=h[1];if(r)r.textContent="الحديث "+(n+1)+" — "+h[2];const c=document.querySelector("#hadithToday .ht-count");if(c)c.textContent="يتجدد تلقائياً كل يوم · "+(n+1)+" من 42"}

'<div class="np"><button class="b g" onclick="editV('+v.no+')">✏️ تعديل</button> <button class="b '+(CF=="v"+v.no?"r":"g")+'" onclick="delV('+v.no+')">'+(CF=="v"+v.no?"تأكيد الحذف":"🗑️ حذف")+"</button></div></div>"}).join("")}
